[package]
name = "supertravel-desktop"
version = "0.1.3"
description = "SuperTravel 本地旅行规划工作台"
edition = "2021"
rust-version = "1.90"

[lib]
name = "supertravel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Never enabled by the release packaging command.
native-gui-tests = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "~2.14"
tauri-plugin-single-instance = "2"
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
url = "2"
keyring = "=4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
