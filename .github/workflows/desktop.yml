name: Desktop bundles

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2 xvfb xauth dbus-x11 gnome-keyring libglib2.0-bin
      - run: npm ci
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
      - run: python scripts/test-platform.py
      - name: Build native app and smoke-test startup
        id: build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          STA_UPDATER_PUBLIC_KEY: ${{ vars.STA_UPDATER_PUBLIC_KEY }}
          STA_UPDATE_ENDPOINT: ${{ vars.STA_UPDATE_ENDPOINT }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: node scripts/ci-build.mjs ${{ matrix.target }} ${{ matrix.bundles }}
      - name: Native Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --lib --locked --target ${{ matrix.target }}
      - name: Build real native credential probe
        run: cargo build --manifest-path src-tauri/Cargo.toml --example credential-probe --release --locked --target ${{ matrix.target }}
      - name: Verify Windows Credential Manager
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $probeOutput = & "src-tauri/target/${{ matrix.target }}/release/examples/credential-probe.exe" "artifacts/${{ matrix.target }}/credential-report.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native credential probe failed' }
          $probeOutput | Write-Output
          if ($probeOutput -notcontains 'SUPERTRAVEL_CREDENTIAL_PROBE_OK:windows') { throw 'Missing credential probe success evidence' }
      - name: Verify isolated macOS Keychain
        if: runner.os == 'macOS'
        timeout-minutes: 3
        shell: bash
        env:
          STA_CREDENTIAL_TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import os, pathlib, shlex, subprocess, tempfile, uuid
          def security(*args, check=True):
              return subprocess.run(['security', *args], check=check, capture_output=True, text=True, timeout=15)
          previous_default = shlex.split(security('default-keychain', '-d', 'user', check=False).stdout)
          if previous_default == ['<NULL>']:
              previous_default = []
          previous_search = shlex.split(security('list-keychains', '-d', 'user').stdout)
          target = os.environ['STA_CREDENTIAL_TARGET']
          with tempfile.TemporaryDirectory(prefix='sta-credential-', dir=os.environ['RUNNER_TEMP']) as temporary:
              keychain = str(pathlib.Path(temporary) / 'probe.keychain-db')
              password = uuid.uuid4().hex  # Only protects this disposable CI test keychain.
              created = False
              try:
                  security('create-keychain', '-p', password, keychain)
                  created = True
                  security('default-keychain', '-d', 'user', '-s', keychain)
                  security('unlock-keychain', '-p', password, keychain)
                  result = subprocess.run([f'src-tauri/target/{target}/release/examples/credential-probe', f'artifacts/{target}/credential-report.json'], capture_output=True, text=True, timeout=60)
                  print(result.stdout, end='')
                  print(result.stderr, end='')
                  result.check_returncode()
                  assert 'SUPERTRAVEL_CREDENTIAL_PROBE_OK:macos' in result.stdout.splitlines()
              finally:
                  commands = [('default-keychain', '-d', 'user', '-s', *previous_default), ('list-keychains', '-d', 'user', '-s', *previous_search)]
                  if created:
                      commands.append(('delete-keychain', keychain))
                  cleanup_failed = False
                  for command in commands:
                      try:
                          cleanup_failed |= security(*command, check=False).returncode != 0
                      except subprocess.SubprocessError:
                          cleanup_failed = True
                  if cleanup_failed:
                      raise RuntimeError('Could not restore the CI keychain preferences or remove the temporary keychain')
          PY
      - name: Verify isolated Linux Secret Service
        if: runner.os == 'Linux'
        timeout-minutes: 3
        shell: bash
        run: |
          credential_root="$(mktemp -d "$RUNNER_TEMP/sta-credential.XXXXXX")"
          [[ "$credential_root" == "$RUNNER_TEMP"/sta-credential.* ]] || exit 1
          trap 'rm -rf -- "$credential_root"' EXIT
          mkdir -p "$credential_root/home" "$credential_root/data" "$credential_root/config" "$credential_root/runtime/keyring"
          chmod 700 "$credential_root/runtime"
          env HOME="$credential_root/home" XDG_DATA_HOME="$credential_root/data" XDG_CONFIG_HOME="$credential_root/config" XDG_RUNTIME_DIR="$credential_root/runtime" \
            dbus-run-session -- bash -euo pipefail -s -- "$PWD/src-tauri/target/${{ matrix.target }}/release/examples/credential-probe" "$PWD/artifacts/${{ matrix.target }}/credential-report.json" <<'SH'
          gnome-keyring-daemon --foreground --unlock --components=secrets --control-directory="$XDG_RUNTIME_DIR/keyring" <<< 'supertravel-ci-test-only' > "$XDG_RUNTIME_DIR/keyring.log" 2>&1 &
          keyring_pid=$!
          trap 'kill "$keyring_pid" 2>/dev/null || true; wait "$keyring_pid" 2>/dev/null || true' EXIT
          gdbus wait --session --timeout 15 org.freedesktop.secrets
          output="$(timeout 60 "$1" "$2")"
          printf '%s\n' "$output"
          [[ "$output" == 'SUPERTRAVEL_CREDENTIAL_PROBE_OK:linux' ]]
          SH
      - name: Build isolated native updater probe
        if: runner.os != 'Windows' && steps.build.outputs.signed == 'true'
        run: cargo build --manifest-path src-tauri/Cargo.toml --example updater-probe --release --locked --target ${{ matrix.target }}
      - name: Verify native update and preserved data
        if: runner.os != 'Windows' && steps.build.outputs.signed == 'true'
        env:
          STA_UPDATER_PUBLIC_KEY: ${{ vars.STA_UPDATER_PUBLIC_KEY }}
        shell: bash
        run: |
          args=(python scripts/smoke-native-update.py --artifact-dir "artifacts/${{ matrix.target }}" --driver "$PWD/src-tauri/target/${{ matrix.target }}/release/examples/updater-probe")
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a dbus-run-session -- "${args[@]}"
          else
            "${args[@]}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish complete signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
      - name: Verify every platform before publishing metadata
        run: python scripts/prepare-release.py --merge artifacts --output release
      - name: Stage release, upload assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_state="$(python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          endpoint = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/releases/tags/" + urllib.parse.quote(os.environ["GITHUB_REF_NAME"], safe="")
          request = urllib.request.Request(endpoint, headers={"Accept": "application/vnd.github+json", "User-Agent": "SuperTravel-release"})
          request.add_unredirected_header("Authorization", "Bearer " + os.environ["GH_TOKEN"])
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise SystemExit(f"Release lookup failed: HTTP {error.code}")
              print("missing")
          else:
              print("draft" if release["draft"] else "published")
          PY
          )"
          case "$release_state" in
            missing) gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "SuperTravel $GITHUB_REF_NAME" --notes "桌面骨架验证版本。包含 Windows、macOS（Apple Silicon / Intel）、Linux 安装包及签名更新。当前界面为示例行程，旅行模型与真实地图服务尚未接入。macOS 包尚未公证，首次打开可能需要系统设置允许。" ;;
            draft) ;;
            published) echo "Release already published; refusing to replace assets." >&2; exit 1 ;;
            *) echo "Unexpected release state; refusing to upload." >&2; exit 1 ;;
          esac
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
