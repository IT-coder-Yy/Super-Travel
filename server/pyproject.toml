[project]
name = "supertravel-server"
version = "0.1.4"
description = "SuperTravel local desktop API and shared tool service"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.135.3",
  "pydantic==2.12.5",
  "uvicorn==0.42.0",
  "starlette==1.0.0",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "mcp==2.3.0",
  "reportlab==5.1.0",
  "markdown-it-py==4.2.0",
  "regex==2026.9.29"
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "pyinstaller==6.20.0",
  "pypdf==6.21.4",
  "fonttools==4.68.0"
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["supertravel_server"]
package-dir = { supertravel_server = "src" }

[tool.setuptools.package-data]
supertravel_server = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
